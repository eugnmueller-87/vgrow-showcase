  <text x="54" y="815" class="p">Onboarding, refill records, wiki browsing, plant archives and exports work without model inference.</text>
  <text x="54" y="851" fill="#668471" font-size="17">High-level product flows &#183; Setup and evidence requirements apply &#183; Checkpoint 27 October 2026</text>
