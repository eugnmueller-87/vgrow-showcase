<!doctype html>
<!-- The title card of docs/images/cover.webp. scripts/build_cover.py renders it on a transparent page and lays it over
     the garden recording. Chips and the caption are placed from measured text widths, so a font fallback cannot make
     them collide. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#83ba9c" stroke-opacity=".09"/></pattern>
    <clipPath id="card"><rect x="44" y="64" width="724" height="532" rx="26"/></clipPath>
    <linearGradient id="cardFill" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0e241c" stop-opacity=".93"/><stop offset="1" stop-color="#173f31" stop-opacity=".86"/></linearGradient>
  </defs>
  <rect x="44" y="64" width="724" height="532" rx="26" fill="url(#cardFill)"/>
  <rect x="44" y="64" width="724" height="532" fill="url(#grid)" clip-path="url(#card)"/>
  <rect x="44.5" y="64.5" width="723" height="531" rx="26" fill="none" stroke="#9acfa8" stroke-opacity=".28"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="90" y="110" width="170" height="34" rx="17" fill="#315d48"/>
    <text x="175" y="133" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2.2" fill="#d7edcf">SELF-HOSTED</text>
    <text x="86" y="248" font-size="90" font-weight="750" letter-spacing="-3" fill="#f2f6ed">VGrow Cockpit</text>
    <text x="90" y="310" font-size="31" fill="#d2e6d4">From readings to everyday care.</text>
    <text x="90" y="354" font-size="31" fill="#d2e6d4">Local AI. Connected workflows. One cockpit.</text>
    <line x1="91" y1="404" x2="722" y2="404" stroke="#9acfa8" stroke-opacity=".18"/>
    <g id="chips" font-size="14" font-weight="650" letter-spacing="1.3" fill="#bddcc3"></g>
    <text x="91" y="548" font-size="18" fill="#8db69d">Independent project · Compatible with VIVOSUN VGrow · DE / EN</text>
  </g>
  <g id="caption" font-family="Segoe UI, Helvetica, Arial, sans-serif"></g>
</svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const chips = document.getElementById("chips");
let x = 91;
["LIVE SENSORS", "AUTOPILOT", "DUAL CAMERAS", "LOCAL AI", "PLANT RECORDS"].forEach((word, i) => {
  if (i) {
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", x + 11); dot.setAttribute("cy", 448); dot.setAttribute("r", 2.3); dot.setAttribute("fill", "#7cb68d");
    chips.appendChild(dot); x += 22;
  }
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", x); t.setAttribute("y", 453); t.textContent = word;
  chips.appendChild(t); x += t.getBBox().width;
});

const cap = document.getElementById("caption");
const label = document.createElementNS(NS, "text");
label.setAttribute("font-size", "16"); label.setAttribute("fill", "#eef5ea"); label.textContent = "Home screen: Hank's garden";
cap.appendChild(label);
const w = label.getBBox().width, right = 1600 - 34, base = 660 - 40;
const pill = document.createElementNS(NS, "rect");
pill.setAttribute("x", right - w - 32); pill.setAttribute("y", base - 22); pill.setAttribute("width", w + 32);
pill.setAttribute("height", 34); pill.setAttribute("rx", 17); pill.setAttribute("fill", "#102820"); pill.setAttribute("fill-opacity", ".78");
cap.insertBefore(pill, label);
label.setAttribute("x", right - w - 16); label.setAttribute("y", base);
</script>
</body></html>
