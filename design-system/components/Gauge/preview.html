<!-- @dsCard group="Content" height=240 subtitle="value against its target band: in band, high, low, a single-value tick, no reading" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gauge</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;max-width:720px">
  <div class="gauges">
    <div class="gauge"><div class="g-head"><span class="lbl">Temperature</span><span class="val">24.6<small>°C</small></span></div><div class="g-bar"><span class="g-band" style="left:40%;width:30%"></span><span class="g-mark" style="left:52%"></span></div><div class="g-foot"><span>18</span><span>22–26 target</span><span>32</span></div></div>
    <div class="gauge"><div class="g-head"><span class="lbl">Humidity</span><span class="val">68<small>%</small></span></div><div class="g-bar"><span class="g-band" style="left:35%;width:30%"></span><span class="g-mark high" style="left:78%"></span></div><div class="g-foot"><span>30</span><span>50–62 target</span><span>90</span></div></div>
    <div class="gauge"><div class="g-head"><span class="lbl">VPD</span><span class="val">0.74<small>kPa</small></span></div><div class="g-bar"><span class="g-band" style="left:45%;width:30%"></span><span class="g-mark low" style="left:32%"></span></div><div class="g-foot"><span>0</span><span>0.9–1.3 target</span><span>2</span></div></div>
    <div class="gauge"><div class="g-head"><span class="lbl">Light</span><span class="val">–<small>%</small></span></div><div class="g-bar"><span class="g-tick" style="left:87%"></span><span class="g-mark none" style="left:0"></span></div><div class="g-foot"><span>0</span><span>preset 87</span><span>100</span></div></div>
  </div>
</div>
</body></html>
