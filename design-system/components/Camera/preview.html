<!-- @dsCard group="Content" height=520 subtitle="the 16:9 frame with its placeholder and REC badge, zoom control, record button and freshness line" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Camera</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;max-width:640px">
  <div class="cam-frame">
    <div class="cam-ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>No picture yet. The camera sends one every 60 s while the light is on.</span></div>
    <span class="cam-badge"><i class="rec-dot"></i>REC 02:15</span>
  </div>
  <div class="cam-side">
    <div class="camera-zoom" role="group" aria-label="Zoom"><button aria-label="Zoom out" disabled>−</button><span>1×</span><button aria-label="Zoom in">+</button><button aria-label="Fit">Fit</button></div>
    <button class="btn rec on"><i class="rec-dot"></i>Stop recording</button>
    <button class="btn">Fullscreen</button>
    <p class="camera-details">Last picture 51 s ago · 1280 × 720 · recordings kept 7 days</p>
  </div>
</div>
</body></html>
