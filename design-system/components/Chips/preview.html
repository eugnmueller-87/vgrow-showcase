<!-- @dsCard group="Controls" height=140 subtitle="pot features: multi-select choice chips, one chosen, one locked" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chips</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;display:grid;gap:8px;max-width:720px">
  <span style="font:600 13px/18px var(--font-sans)">What fits the pot</span>
  <div class="chips" role="group" aria-label="What fits the pot">
    <button aria-pressed="true">drain holes</button>
    <button aria-pressed="true">saucer</button>
    <button aria-pressed="false">feet or raised</button>
    <button aria-pressed="false">wick</button>
    <button aria-pressed="false">can be lifted</button>
    <button aria-pressed="false">scale at hand</button>
    <button aria-pressed="false" class="is-locked" aria-disabled="true">drier in late flower</button>
  </div>
</div>
</body></html>
