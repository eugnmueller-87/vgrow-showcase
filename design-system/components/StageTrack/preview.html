<!-- @dsCard group="Content" height=300 subtitle="six stages on a rail: done, current, next, with the confirmation strip" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StageTrack</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;max-width:720px">
  <div class="stage-track" role="group" aria-label="Stage">
    <span class="fill" style="width:50%"></span>
    <button class="st-step done"><span class="art"><svg viewBox="0 0 52 102" aria-hidden="true"><rect x="16" y="78" width="20" height="22" rx="3" fill="var(--plant-pot)"/><path d="M26 80V60" stroke="var(--plant-leaf-dark)" stroke-width="3" stroke-linecap="round"/><path d="M26 66c-6 0-10-4-10-10 6 0 10 4 10 10z" fill="var(--plant-leaf)"/></svg></span><span class="dot"></span><span class="lbl">Seedling</span></button>
    <button class="st-step done"><span class="art"><svg viewBox="0 0 52 102" aria-hidden="true"><rect x="16" y="78" width="20" height="22" rx="3" fill="var(--plant-pot)"/><path d="M26 80V46" stroke="var(--plant-leaf-dark)" stroke-width="3" stroke-linecap="round"/><path d="M26 60c-8 0-13-5-13-13 8 0 13 5 13 13zM26 52c0-8 5-13 13-13 0 8-5 13-13 13z" fill="var(--plant-leaf)"/></svg></span><span class="dot"></span><span class="lbl">Vegetative</span></button>
    <button class="st-step done"><span class="art"><svg viewBox="0 0 52 102" aria-hidden="true"><rect x="16" y="78" width="20" height="22" rx="3" fill="var(--plant-pot)"/><path d="M26 80V30" stroke="var(--plant-leaf-dark)" stroke-width="3" stroke-linecap="round"/><path d="M26 60c-9 0-14-6-14-14 9 0 14 6 14 14zM26 44c0-9 6-14 14-14 0 9-6 14-14 14z" fill="var(--plant-leaf)"/></svg></span><span class="dot"></span><span class="lbl">Stretch</span></button>
    <button class="st-step current" aria-current="step"><span class="art"><svg viewBox="0 0 52 102" aria-hidden="true"><rect x="16" y="78" width="20" height="22" rx="3" fill="var(--plant-pot)"/><path d="M26 80V22" stroke="var(--plant-leaf-dark)" stroke-width="3" stroke-linecap="round"/><path d="M26 62c-9 0-14-6-14-14 9 0 14 6 14 14zM26 46c0-9 6-14 14-14 0 9-6 14-14 14z" fill="var(--plant-leaf)"/><circle cx="26" cy="22" r="6" fill="var(--plant-bud)"/><circle cx="26" cy="18" r="2" fill="var(--plant-pistil)"/></svg></span><span class="dot"></span><span class="lbl">Early flower</span></button>
    <button class="st-step next"><span class="art"><svg viewBox="0 0 52 102" aria-hidden="true"><rect x="16" y="78" width="20" height="22" rx="3" fill="var(--plant-pot)"/><path d="M26 80V20" stroke="var(--plant-leaf-dark)" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="22" r="9" fill="var(--plant-bud)"/><circle cx="23" cy="18" r="2" fill="var(--plant-pistil-ripe)"/><circle cx="30" cy="20" r="2" fill="var(--plant-pistil-ripe)"/></svg></span><span class="dot"></span><span class="lbl">Late flower</span></button>
    <button class="st-step next"><span class="art"><svg viewBox="0 0 52 102" aria-hidden="true"><rect x="16" y="78" width="20" height="22" rx="3" fill="var(--plant-pot)"/><path d="M26 80V20" stroke="var(--plant-leaf-dark)" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="22" r="10" fill="var(--plant-amber)"/></svg></span><span class="dot"></span><span class="lbl">Harvest</span></button>
  </div>
  <div class="stage-confirm"><b>Early flower since Oct 24, day 9 of about 21.</b><div class="btn-row"><button class="btn sm primary">Confirm the stage</button><button class="btn sm">Still stretching</button></div></div>
</div>
</body></html>
