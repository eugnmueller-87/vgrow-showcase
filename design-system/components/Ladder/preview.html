<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ladder</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;max-width:720px">
  <ol class="ladder" aria-label="What manual, suggest and automatic mean">
    <li data-lvl="0"><span class="lvl"><i></i><i></i><i></i></span><b>Manual</b><small>You switch the device. Hank only reports.</small></li>
    <li data-lvl="1"><span class="lvl"><i></i><i></i><i></i></span><b>Suggest</b><small>Hank proposes a step; nothing moves until you confirm.</small></li>
    <li data-lvl="2" class="on"><span class="lvl"><i></i><i></i><i></i></span><b>Automatic</b><small>Hank switches inside the limits and logs the reason.</small></li>
  </ol>
</div>
</body></html>
