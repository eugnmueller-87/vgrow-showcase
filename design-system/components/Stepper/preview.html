<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stepper</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;max-width:560px">
  <div class="stepper" role="group" aria-label="Exhaust fan level">
    <button class="st" aria-label="Lower">−</button>
    <div class="bars" aria-hidden="true"><i class="on" style="height:30%"></i><i class="on" style="height:40%"></i><i class="on" style="height:50%"></i><i style="height:60%"></i><i style="height:70%"></i><i style="height:80%"></i><i style="height:85%"></i><i style="height:90%"></i><i style="height:95%"></i><i style="height:100%"></i></div>
    <button class="st" aria-label="Raise">+</button>
    <span class="level">3</span>
  </div>
</div>
</body></html>
