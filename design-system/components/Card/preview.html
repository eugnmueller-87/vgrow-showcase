<!-- @dsCard group="Containers" height=340 subtitle="the Autopilot hero card: kicker with Hank, hero title, mode, health line with counts" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Card</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px">
  <section class="card" style="max-width:760px">
    <div class="kicker">
      <img src="/_blob/50481f7a85b2e979b8fdbeeef974e592" alt="">
      <div><small>Hank is watching over your grow</small><h3 class="hero" style="margin:0;font:700 20px/26px var(--font-sans);letter-spacing:-0.01em">Autopilot</h3></div>
      <span class="status ok" style="margin-left:auto">Online</span>
    </div>
    <p><b style="font-weight:600">VGrow Y18</b> <span class="muted">· Ice Cream Cake Automatic · Early flower · 62 cm</span></p>
    <div class="seg" role="group" aria-label="Autopilot mode" style="width:420px;max-width:100%;margin:12px 0 4px">
      <button class="arm" aria-pressed="false">Off</button><button aria-pressed="false">Observe</button><button aria-pressed="true">Automatic</button>
    </div>
    <p class="seg-note">Hank switches devices inside the limits and tells you why. Suggestions only where you set Suggest.</p>
    <div class="counts" style="margin-top:20px"><b style="font-weight:600">Hank needs your help with these devices</b> <span class="status ok">1 monitoring</span><span class="status warn">1 needs you</span><span class="status info">2 paused</span></div>
  </section>
</div>
</body></html>
