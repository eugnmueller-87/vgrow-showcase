<!-- @dsCard group="Content" height=220 subtitle="climate tiles with the number style, sensor sparklines, a stale tile" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tile</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px">
  <div class="tiles" style="max-width:820px">
    <div class="tile"><span class="k">Temperature</span><span class="src">Probe · 51 s ago</span><span class="val"><span class="v">24.6</span><span class="u">°C</span></span><span class="meta"><span class="status ok">In band</span></span><svg class="spark temp" viewBox="0 0 160 22" preserveAspectRatio="none"><path d="M0 16 20 14 40 15 60 11 80 10 100 12 120 8 140 7 160 9"/></svg></div>
    <div class="tile"><span class="k">Humidity</span><span class="src">Probe · 51 s ago</span><span class="val"><span class="v">68</span><span class="u">%</span></span><span class="meta"><span class="status warn">Above 62%</span></span><svg class="spark hum" viewBox="0 0 160 22" preserveAspectRatio="none"><path d="M0 12 20 13 40 10 60 9 80 7 100 8 120 5 140 6 160 4"/></svg></div>
    <div class="tile"><span class="k">VPD</span><span class="src">Computed</span><span class="val"><span class="v">0.94</span><span class="u">kPa</span></span><span class="meta"><span class="status ok">In band</span></span><svg class="spark vpd" viewBox="0 0 160 22" preserveAspectRatio="none"><path d="M0 10 20 11 40 12 60 10 80 11 100 9 120 10 140 11 160 10"/></svg></div>
    <div class="tile stale"><span class="k">Soil moisture</span><span class="src">Sensor · 2 h ago</span><span class="val"><span class="v">41</span><span class="u">%</span></span><span class="meta"><span class="status warn">Stale reading</span></span><svg class="spark water" viewBox="0 0 160 22" preserveAspectRatio="none"><path d="M0 6 40 8 80 11 120 14 160 17"/></svg></div>
  </div>
</div>
</body></html>
