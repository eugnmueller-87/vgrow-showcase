<!-- @dsCard group="Actions" height=200 subtitle="primary · secondary · soft · arm · small · disabled · busy · locked · icon" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;display:grid;gap:16px">
  <div class="btn-row">
    <button class="btn primary">Save the pot</button>
    <button class="btn">History &amp; archives</button>
    <button class="btn soft">Check lamp distance</button>
    <button class="btn arm">Switch the rule off</button>
    <button class="btn sm">Confirm refill</button>
  </div>
  <div class="btn-row">
    <button class="btn" disabled>Stop pump now</button>
    <button class="btn primary" disabled>Looking at the photo … 2:15 min</button>
    <button class="btn is-locked" aria-disabled="true">Allowed, take back</button>
    <span class="muted" style="font-size:13px">Locked: the box is offline</span>
    <button class="icon-btn" aria-label="Alerts, 1 unread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><span class="count">1</span></button>
    <button class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3-1 3-3 1-2 5 2 5 3 1 1 3h4l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</div>
</body></html>
