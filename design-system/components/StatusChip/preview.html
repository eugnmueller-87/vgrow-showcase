<!-- @dsCard group="Status" height=160 subtitle="ok · warn · info · bad · neutral · counts · on the sidebar" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StatusChip</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;display:grid;gap:14px">
  <div class="counts">
    <span class="status ok">Monitoring</span>
    <span class="status warn">Needs you</span>
    <span class="status info">Paused until 9:37 AM</span>
    <span class="status bad">Stopped: humidity did not rise</span>
    <span class="status">Off</span>
    <span class="status warn">Setup needed</span>
  </div>
  <div class="counts"><b style="font-weight:600">Hank needs your help with these devices</b> <span class="status ok">1 monitoring</span><span class="status warn">1 needs you</span><span class="status info">2 paused</span></div>
  <div style="display:flex;gap:8px;padding:10px 12px;background:var(--side);border-radius:var(--radius-md);width:max-content">
    <span class="status on-side ok">Online</span><span class="status on-side bad">Server down</span><span class="status on-side demo">Demo data</span>
  </div>
</div>
</body></html>
