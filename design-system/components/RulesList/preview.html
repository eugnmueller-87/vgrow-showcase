<!-- @dsCard group="Content" height=260 subtitle="numbered alert rules with their toggles" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RulesList</title></head>
<body style="margin:0">
<div class="vg" style="padding:16px;max-width:680px">
  <ol class="rules" aria-label="Alert rules">
    <li><span class="what">Temperature above 30 °C for 10 minutes<small>Push and in-app. Last fired Oct 29, 2:14 PM.</small></span><button class="toggle" aria-pressed="true">On</button></li>
    <li><span class="what">Humidity below 40% for 15 minutes<small>Push and in-app.</small></span><button class="toggle" aria-pressed="true">On</button></li>
    <li><span class="what">Humidifier did not raise humidity after switching on<small class="need">Needs the probe on USB 2 · set it up in Devices</small></span><button class="toggle" aria-pressed="false">Off</button></li>
    <li><span class="what">Box offline for 5 minutes<small>In-app only.</small></span><button class="toggle" aria-pressed="true">On</button></li>
  </ol>
</div>
</body></html>
